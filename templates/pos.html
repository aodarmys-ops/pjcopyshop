<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #eef2f7; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden;}
        .glass-panel {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }
        .cart-list { flex-grow: 1; overflow-y: auto; }
        .total-box { background: #2c3e50; color: white; border-radius: 10px; padding: 20px; text-align: right;}
    </style>

    <!-- Global UI Additions -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    <style>
        .font-sizer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            padding: 5px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 9999;
            display: flex;
            gap: 5px;
        }
        .font-sizer button {
            border: none;
            background: #f8f9fa;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .font-sizer button:hover { background: #e9ecef; }
    </style>

</head>
<body class="p-3">
    <div class="row g-3 h-100">
        <!-- Left: Product Search & List -->
        <div class="col-md-7 h-100">
            <div class="glass-panel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="fw-bold m-0">🛒 POS (หน้าร้าน)</h3>
                    <a href="/" class="btn btn-outline-secondary rounded-pill">⬅ กลับหน้าหลัก</a>
                </div>
                
                <div class="input-group mb-4 shadow-sm">
                    <input type="text" id="barcodeInput" class="form-control form-control-lg border-primary" placeholder="สแกนบาร์โค้ด หรือ พิมพ์ชื่อสินค้า (แล้วกด Enter)" autofocus>
                    <button class="btn btn-primary px-4 fw-bold" onclick="searchProduct()">ค้นหา</button>
                </div>

                <div class="row g-2" id="searchResults">
                    <!-- search results will go here if typing name -->
                </div>
            </div>
        </div>

        <!-- Right: Cart & Checkout -->
        <div class="col-md-5 h-100">
            <div class="glass-panel">
                <h4 class="fw-bold mb-3">ตะกร้าสินค้า</h4>
                
                <div class="cart-list mb-3">
                    <table class="table align-middle table-hover">
                        <tbody id="cartTable">
                            <!-- cart items -->
                        </tbody>
                    </table>
                </div>

                <div class="mt-auto">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">เลือกลูกค้า (สะสมแต้ม)</label>
                        <select class="form-select fw-bold border-primary shadow-sm mb-2" id="customerSelect" onchange="handleCustomerSelect()">
                            <option value="">👤 ลูกค้าทั่วไป (ไม่สะสมแต้ม)</option>
                            <!-- Customers populated via JS -->
                        </select>
                        <div id="pointsInfoContainer" class="d-none">
                            <button id="redeemPointsBtn" class="btn btn-sm btn-outline-warning text-dark fw-bold w-100" onclick="toggleRedeemPoints()">
                                🎁 ใช้แต้ม 10 แต้ม
                            </button>
                            <small id="pointsStatusText" class="text-muted fw-bold mt-1 d-block"></small>
                        </div>
                    </div>

                    <div class="mb-2 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-muted">ส่วนลดท้ายบิล (Discount) </span>
                        <input type="number" step="0.01" min="0" class="form-control text-end w-50 fw-bold" id="discountInput" value="0" onchange="renderCart()">
                    </div>

                    <div class="total-box mb-3 shadow">
                        <div class="d-flex justify-content-between align-items-end mb-1">
                            <h5 class="m-0 text-white-50">ยอดรวมสุทธิ (Net Total)</h5>
                            <small class="text-warning fw-bold" id="pointsEarnedBox">⭐ ได้รับ 0 แต้ม</small>
                        </div>
                        <h1 class="m-0 fw-bold text-warning" id="totalAmount">0.00</h1>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label text-muted small fw-bold">ช่องทางการชำระ</label>
                            <select class="form-select fw-bold text-primary" id="paymentMethod">
                                <option value="Cash">💵 เงินสด</option>
                                <option value="PromptPay">📱 สแกนจ่าย</option>
                                <option value="Credit Card">💳 บัตรเครดิต</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small fw-bold">สถานะ</label>
                            <select class="form-select fw-bold text-success" id="paymentStatus">
                                <option value="Paid">✅ ชำระแล้ว</option>
                                <option value="Unpaid">❌ ค้างชำระ</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn btn-success btn-lg w-100 fw-bold rounded-pill shadow" onclick="checkout()">
                        ชำระเงิน (Checkout)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let allCustomers = [];
        let isRedeemingPoints = false;
        let selectedCustomerPoints = 0;

        document.getElementById('barcodeInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchProduct();
            }
        });

        async function loadCustomers() {
            const res = await fetch('/api/customers');
            allCustomers = await res.json();
            const select = document.getElementById('customerSelect');
            
            allCustomers.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.text = `⭐ ${c.name} ${c.phone ? '('+c.phone+')' : ''} - แต้มสะสม: ${c.points}`;
                select.appendChild(opt);
            });
        }

        function handleCustomerSelect() {
            isRedeemingPoints = false;
            updateRedeemBtnUI();
            
            const customerId = document.getElementById('customerSelect').value;
            const container = document.getElementById('pointsInfoContainer');
            const statusText = document.getElementById('pointsStatusText');
            const redeemBtn = document.getElementById('redeemPointsBtn');

            if (!customerId) {
                container.classList.add('d-none');
                selectedCustomerPoints = 0;
                return;
            }

            container.classList.remove('d-none');
            const c = allCustomers.find(x => x.id == customerId);
            selectedCustomerPoints = c ? c.points : 0;

            if (selectedCustomerPoints >= 10) {
                redeemBtn.classList.remove('d-none');
                statusText.innerText = `(ปัจจุบันมี ${selectedCustomerPoints} แต้ม)`;
            } else {
                redeemBtn.classList.add('d-none');
                statusText.innerText = `(ปัจจุบันมี ${selectedCustomerPoints} แต้ม - ต้องมี 10 แต้มขึ้นไปจึงจะแลกได้)`;
            }
        }

        function toggleRedeemPoints() {
            isRedeemingPoints = !isRedeemingPoints;
            updateRedeemBtnUI();
            renderCart(); // re-calculate earned points
        }

        function updateRedeemBtnUI() {
            const redeemBtn = document.getElementById('redeemPointsBtn');
            if (isRedeemingPoints) {
                redeemBtn.classList.replace('btn-outline-warning', 'btn-warning');
                redeemBtn.innerHTML = '✅ กำลังใช้ 10 แต้ม (คลิกเพื่อยกเลิก)';
            } else {
                redeemBtn.classList.replace('btn-warning', 'btn-outline-warning');
                redeemBtn.innerHTML = '🎁 ใช้แต้ม 10 แต้ม';
            }
        }

        async function searchProduct() {
            const query = document.getElementById('barcodeInput').value;
            if(!query) return;

            const res = await fetch(`/api/products/search?q=${encodeURIComponent(query)}`);
            const products = await res.json();
            
            if(products.length === 1 && products[0].barcode === query) {
                // Exact barcode match (like from a physical scanner)
                addToCart(products[0]);
                document.getElementById('barcodeInput').value = '';
            } else {
                // Show results for manual search
                let html = '';
                products.forEach(p => {
                    html += `
                        <div class="col-4">
                            <div class="card h-100 shadow-sm border-0 bg-light" style="cursor:pointer;" onclick='addToCart(${JSON.stringify(p).replace(/'/g, "&apos;")})'>
                                <div class="card-body text-center p-3">
                                    <h6 class="card-title fw-bold m-0 text-dark">${p.name}</h6>
                                    <small class="text-primary fw-bold">${formatMoney(p.price)}</small>
                                </div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('searchResults').innerHTML = html;
            }
        }

        function addToCart(product) {
            const existing = cart.find(i => i.id === product.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('barcodeInput').focus();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartTable');
            tbody.innerHTML = '';
            let subtotalSum = 0;
            
            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                subtotalSum += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="fw-bold">${item.name}</div>
                        </td>
                        <td style="width: 100px;">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"></span>
                                <input type="number" step="0.01" class="form-control text-center fw-bold" value="${item.price}" onchange="updatePrice(${item.id}, this.value)">
                            </div>
                        </td>
                        <td style="width: 80px;">
                            <div class="input-group input-group-sm">
                                <input type="number" class="form-control text-center fw-bold" value="${item.qty}" onchange="updateQty(${item.id}, this.value)">
                            </div>
                        </td>
                        <td class="text-end fw-bold text-dark">${formatMoney(subtotal)}</td>
                        <td class="text-end" style="width: 40px;">
                            <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="removeFromCart(${item.id})">✖</button>
                        </td>
                    </tr>
                `;
            });
            
            const discount = parseFloat(document.getElementById('discountInput').value) || 0;
            const netTotal = Math.max(0, subtotalSum - discount);
            
            document.getElementById('totalAmount').innerText = `${formatMoney(netTotal)}`;

            // Calculate points
            let earnedPoints = 0;
            cart.forEach(item => {
                if (item.type === 'Brewed Drink') {
                    earnedPoints += parseInt(item.qty);
                }
            });
            
            if (isRedeemingPoints) {
                earnedPoints = Math.max(0, earnedPoints - 1);
            }
            
            document.getElementById('pointsEarnedBox').innerText = `⭐ ได้รับ ${earnedPoints} แต้ม`;
        }

        function updateQty(id, newQty) {
            const qty = parseInt(newQty);
            if(qty <= 0) {
                removeFromCart(id);
                return;
            }
            const item = cart.find(i => i.id === id);
            if (item) item.qty = qty;
            renderCart();
        }

        function updatePrice(id, newPrice) {
            const price = parseFloat(newPrice);
            if(price < 0) return;
            const item = cart.find(i => i.id === id);
            if (item) item.price = price;
            renderCart();
        }

        async function checkout() {
            if (cart.length === 0) {
                alert("ตะกร้าสินค้าว่างเปล่า!");
                return;
            }
            
            const subtotalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const discount = parseFloat(document.getElementById('discountInput').value) || 0;
            const total = Math.max(0, subtotalSum - discount);
            const method = document.getElementById('paymentMethod').value;
            const status = document.getElementById('paymentStatus').value;
            const customerId = document.getElementById('customerSelect').value;
            
            const payload = {
                total_amount: total,
                discount: discount,
                payment_method: method,
                payment_status: status,
                customer_id: customerId || null,
                redeemed_points: isRedeemingPoints ? 10 : 0,
                items: cart
            };

            const res = await fetch('/api/sales', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                let msg = "ทำรายการสำเร็จ!\n\n";
                if(method === 'Cash') {
                    msg += "➡️ สั่งเปิดลิ้นชักเก็บเงิน (Cash Drawer)\n";
                }
                msg += "ระบบได้ตัดสต๊อกสินค้าเรียบร้อยแล้ว\n(สามารถพิมพ์ใบเสร็จย้อนหลังได้ที่หน้ารายงาน)";
                
                alert(msg);
                
                cart = [];
                isRedeemingPoints = false;
                renderCart();
                document.getElementById('barcodeInput').value = '';
                document.getElementById('customerSelect').value = '';
                handleCustomerSelect(); // reset points UI
                
                // reload customers to get updated points
                document.getElementById('customerSelect').innerHTML = '<option value="">👤 ลูกค้าทั่วไป (ไม่สะสมแต้ม)</option>';
                await loadCustomers();
                
                document.getElementById('barcodeInput').focus();
            }
        }

        // Init
        loadCustomers();
    </script>

    <!-- Global UI Scripts -->
    <div class="font-sizer">
        <button onclick="changeFontSize(-1)" title="ลดขนาดตัวอักษร">A-</button>
        <button onclick="changeFontSize(0)" title="ขนาดปกติ">A</button>
        <button onclick="changeFontSize(1)" title="เพิ่มขนาดตัวอักษร">A+</button>
    </div>
    <script>
        // Font Size Logic
        const sizes = ['0.85rem', '1rem', '1.15rem', '1.3rem'];
        let currentSizeIdx = parseInt(localStorage.getItem('fontSizeIdx')) || 1;
        
        function applyFontSize() {
            document.documentElement.style.fontSize = sizes[currentSizeIdx];
        }
        
        function changeFontSize(step) {
            if (step === 0) {
                currentSizeIdx = 1;
            } else {
                currentSizeIdx += step;
                if (currentSizeIdx < 0) currentSizeIdx = 0;
                if (currentSizeIdx >= sizes.length) currentSizeIdx = sizes.length - 1;
            }
            localStorage.setItem('fontSizeIdx', currentSizeIdx);
            applyFontSize();
        }
        
        applyFontSize();

        // Custom Thai Date Formatter for text (DD/MM/YYYY)
        function formatThaiDate(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            if (isNaN(d)) return dateString;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear() + 543;
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // Flatpickr (Thai Calendar + Buddhist Era Header)
        document.addEventListener('DOMContentLoaded', function() {
            const thaiFormatter = function(date, format, locale) {
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                if (format === "Y-m-d") {
                    return `${date.getFullYear()}-${m}-${d}`;
                }
                const y = date.getFullYear() + 543;
                return `${d}/${m}/${y}`;
            };
            
            function updateYearToBE(instance) {
                if (instance.yearElements && instance.yearElements.length > 0) {
                    const yearInput = instance.yearElements[0];
                    const currentVal = parseInt(yearInput.value);
                    if (currentVal < 2500) { // If it's CE, change to BE
                        yearInput.value = currentVal + 543;
                    }
                }
                if (instance.currentYearElement) {
                    const currentVal = parseInt(instance.currentYearElement.value);
                    if (currentVal < 2500) {
                        instance.currentYearElement.value = currentVal + 543;
                    }
                }
            }

            flatpickr("input[type=date]", {
                locale: "th",
                dateFormat: "Y-m-d", 
                altInput: true,
                altFormat: "d/m/Y", 
                formatDate: thaiFormatter,
                onReady: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onOpen: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onYearChange: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onMonthChange: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onPreCalendarPosition: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onChange: function(selectedDates, dateStr, instance) {
                    updateYearToBE(instance);
                }
            });
        });
        
        
        // Global Fetch interceptor to fix BE to CE dates in query params
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if (typeof resource === 'string' && resource.includes('?')) {
                resource = resource.replace(/([?&](?:start_date|end_date)=)(\d{4})(-\d{2}-\d{2})/g, function(match, p1, p2, p3) {
                    let year = parseInt(p2);
                    if (year > 2400) year -= 543;
                    return p1 + year + p3;
                });
            }
            return originalFetch(resource, config);
        };

        // Currency Formatter
        function formatMoney(num) {
            return Number(num).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    </script>

</body>
</html>
