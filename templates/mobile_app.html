<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PJ Copy - ระบบมือถือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #f8f9fa;
            font-family: 'Inter', sans-serif; 
            padding-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            border-radius: 15px;
            background: white;
            color: #1f2937;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.2s;
            border: 1px solid #e5e7eb;
            height: 100%;
        }
        .menu-btn:active {
            transform: scale(0.95);
            background: #f3f4f6;
        }
        .menu-btn i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #3b82f6;
        }
        .menu-btn span {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .logout-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            border-radius: 10px;
            background: #fee2e2;
            color: #dc2626;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 class="mb-0 fw-bold">PJ Copy Shop</h2>
        <p class="mb-0 opacity-75">ระบบจัดการผ่านมือถือ</p>
    </div>

    <div class="container">
        <div class="row g-4">
            <div class="col-12">
                <!-- Temporarily linking to # until we create the count page -->
                <a href="/mobile-count" class="menu-btn">
                    <i class="bi bi-upc-scan"></i>
                    <span>บันทึกตรวจนับสต๊อก</span>
                </a>
            </div>
            <div class="col-12">
                <a href="/reports" class="menu-btn">
                    <i class="bi bi-bar-chart-fill" style="color: #10b981;"></i>
                    <span>ดูรายงาน</span>
                </a>
            </div>
        </div>

        <a href="/logout" class="logout-btn">
            <i class="bi bi-box-arrow-right"></i> ออกจากระบบ
        </a>
    </div>


    <!-- Global Barcode Scanner Fix -->
    <script>
    (function() {
        const thToEnMap = {
            'ๅ':'1','/':'2','-':'3','ภ':'4','ถ':'5','ุ':'6','ึ':'7','ค':'8','ต':'9','จ':'0','ข':'-','ช':'=',
            'ๆ':'q','ไ':'w','ำ':'e','พ':'r','ะ':'t','ั':'y','ี':'u','ร':'i','น':'o','ย':'p','บ':'[','ล':']','\\':'\\',
            'ฟ':'a','ห':'s','ก':'d','ด':'f','เ':'g','้':'h','่':'j','า':'k','ส':'l','ว':';','ง':'\'',
            'ผ':'z','ป':'x','แ':'c','อ':'v','ิ':'b','ื':'n','ท':'m','ม':',','ใ':'.','ฝ':'/',
            '+':'!','๑':'1','๒':'2','๓':'3','๔':'4','ู':'^','฿':'&','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9',
            '๐':'0','"':'W','ฎ':'E','ฑ':'R','ธ':'T','ํ':'Y','๊':'U','ณ':'I','ฯ':'O','ญ':'P','ฐ':'{',',':'}','|':'|',
            'ฤ':'A','ฆ':'S','ฏ':'D','โ':'F','ฌ':'G','็':'H','๋':'J','ษ':'K','ศ':'L','ซ':':','.':'"','(':'Z',')':'X',
            'ฉ':'C','ฮ':'V','ฺ':'B','์':'N','?':'M','ฒ':'<','ฬ':'>','ฦ':'?'
        };
        
        window.thToEnBarcode = function(str) {
            if (!str) return '';
            return str.split('').map(c => thToEnMap[c] || c).join('');
        };

        let lastKeyTime = 0;
        let isScanner = false;
        
        document.addEventListener('keydown', function(e) {
            const currentTime = Date.now();
            if (currentTime - lastKeyTime < 30) {
                isScanner = true;
            } else {
                isScanner = false;
            }
            lastKeyTime = currentTime;
        }, true);

        let previousValues = new Map();
        document.addEventListener('input', function(e) {
            if (e.target && e.target.tagName === 'INPUT' && (e.target.type === 'text' || e.target.type === 'search')) {
                const oldVal = previousValues.get(e.target) || '';
                const newVal = e.target.value;
                previousValues.set(e.target, newVal);
                
                const id = (e.target.id || '').toLowerCase();
                const cls = (e.target.className || '').toLowerCase();
                const isBarcodeField = id.includes('barcode') || id === 'searchbar' || cls.includes('barcode') || e.target.type === 'search';
                
                if (isBarcodeField) {
                    const diff = newVal.length - oldVal.length;
                    // If diff > 3 (pasted/wedged) or isScanner (rapid keypresses)
                    if (diff > 3 || isScanner) {
                        const converted = window.thToEnBarcode(newVal);
                        if (converted !== newVal) {
                            e.target.value = converted;
                            previousValues.set(e.target, converted);
                            // Ensure the model updates in case of frameworks, or other listeners catch the change
                            e.target.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    }
                }
            }
        }, true);
    })();
    </script>

</body>
</html>
