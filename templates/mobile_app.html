<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PJ Copy - ระบบมือถือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #f8f9fa;
            font-family: 'Inter', sans-serif; 
            padding-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            border-radius: 15px;
            background: white;
            color: #1f2937;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.2s;
            border: 1px solid #e5e7eb;
            height: 100%;
        }
        .menu-btn:active {
            transform: scale(0.95);
            background: #f3f4f6;
        }
        .menu-btn i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #3b82f6;
        }
        .menu-btn span {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .logout-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            border-radius: 10px;
            background: #fee2e2;
            color: #dc2626;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 class="mb-0 fw-bold">PJ Copy Shop</h2>
        <p class="mb-0 opacity-75">ระบบจัดการผ่านมือถือ</p>
    </div>

    <div class="container">
        <div class="row g-4">
            <div class="col-12">
                <!-- Temporarily linking to # until we create the count page -->
                <a href="/mobile-count" class="menu-btn">
                    <i class="bi bi-upc-scan"></i>
                    <span>บันทึกตรวจนับสต๊อก</span>
                </a>
            </div>
            <div class="col-12">
                <a href="/reports" class="menu-btn">
                    <i class="bi bi-bar-chart-fill" style="color: #10b981;"></i>
                    <span>ดูรายงาน</span>
                </a>
            </div>
        </div>

        <a href="/logout" class="logout-btn">
            <i class="bi bi-box-arrow-right"></i> ออกจากระบบ
        </a>
    </div>

</body>
</html>
