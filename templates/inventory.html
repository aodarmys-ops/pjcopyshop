<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: 'Inter', sans-serif; min-height: 100vh; padding-top: 20px;}
        .glass-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">📦 Inventory Management</h2>
            <div>
                <a href="/print-barcodes" class="btn btn-primary rounded-pill me-2">🖨️ พิมพ์บาร์โค้ด</a>
                <a href="/" class="btn btn-outline-secondary rounded-pill">⬅ กลับหน้าหลัก</a>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="glass-card mb-4">
                    <h5 class="fw-bold mb-3">เพิ่มสินค้า / บริการใหม่</h5>
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">ชื่อสินค้า</label>
                            <input type="text" class="form-control" id="pName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">ประเภท</label>
                            <select class="form-select" id="pType">
                                <option value="Retail">สินค้าปลีก (Retail)</option>
                                <option value="Service">งานบริการ (Service)</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-4 mb-3">
                                <label class="form-label text-muted small fw-bold">ยี่ห้อ</label>
                                <input type="text" class="form-control" id="pBrand" placeholder="-">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label text-muted small fw-bold">รุ่น</label>
                                <input type="text" class="form-control" id="pModel" placeholder="-">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label text-muted small fw-bold">สี</label>
                                <input type="text" class="form-control" id="pColor" placeholder="-">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">บาร์โค้ด (เว้นว่างไว้หากต้องการให้ระบบสร้างให้)</label>
                            <input type="text" class="form-control" id="pBarcode">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">ต้นทุน</label>
                                <input type="number" step="0.01" min="0.25" class="form-control" id="pCost" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">ราคาขาย</label>
                                <input type="number" step="0.01" min="0.25" class="form-control" id="pPrice" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">จำนวนสต๊อก</label>
                                <input type="number" class="form-control" id="pStock" value="0">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">จุดสั่งซื้อ (Reorder)</label>
                                <input type="number" class="form-control" id="pReorder" value="5">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2 fw-bold rounded-pill">บันทึกข้อมูล</button>
                    </form>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3">รายการสินค้าในระบบ</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mt-2">
                            <thead class="table-light">
                                <tr>
                                    <th>รหัส/บาร์โค้ด</th>
                                    <th>ชื่อสินค้า</th>
                                    <th>ยี่ห้อ/รุ่น/สี</th>
                                    <th>ประเภท</th>
                                    <th>ราคาขาย</th>
                                    <th>คงเหลือ</th>
                                    <th class="text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="productTable">
                                <!-- Data rendered by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            const tbody = document.getElementById('productTable');
            tbody.innerHTML = '';
            data.forEach(p => {
                let row = `<tr>
                    <td><small class="text-muted">${p.barcode || p.id}</small></td>
                    <td class="fw-bold">${p.name}</td>
                    <td><small class="text-muted">${p.brand || '-'} / ${p.model || '-'} / ${p.color || '-'}</small></td>
                    <td><span class="badge rounded-pill bg-${p.type==='Retail'?'primary':'warning text-dark'}">${p.type}</span></td>
                    <td>฿${p.price.toFixed(2)}</td>
                    <td>
                        <span class="${p.stock_qty <= p.reorder_level && p.type === 'Retail' ? 'text-danger fw-bold' : 'text-success fw-bold'}">
                            ${p.type === 'Service' ? '-' : p.stock_qty + ' ชิ้น'}
                        </span>
                    </td>
                    <td class="text-center">
                        ${p.type === 'Retail' ? `<button class="btn btn-sm btn-success rounded-pill px-3" onclick="addStock(${p.id}, '${p.name}')">+ เพิ่มสต๊อก</button>` : '-'}
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        async function addStock(id, name) {
            let qty = prompt(`เพิ่มสต๊อกสำหรับ "${name}"\nจำนวนที่ต้องการรับเข้า:`, "10");
            if(qty === null || qty === "") return;
            qty = parseInt(qty);
            if(isNaN(qty) || qty <= 0) return alert("กรุณาใส่ตัวเลขที่ถูกต้อง");

            await fetch(`/api/products/${id}/stock`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ add_qty: qty })
            });
            fetchProducts();
        }

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('pName').value,
                type: document.getElementById('pType').value,
                brand: document.getElementById('pBrand').value,
                model: document.getElementById('pModel').value,
                color: document.getElementById('pColor').value,
                barcode: document.getElementById('pBarcode').value,
                cost: parseFloat(document.getElementById('pCost').value),
                price: parseFloat(document.getElementById('pPrice').value),
                stock_qty: parseInt(document.getElementById('pStock').value),
                reorder_level: parseInt(document.getElementById('pReorder').value)
            };
            
            await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            e.target.reset();
            fetchProducts();
        });

        // Init
        fetchProducts();
    </script>
</body>
</html>
