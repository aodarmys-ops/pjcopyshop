<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Barcodes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { background: #f5f7fa; padding-top: 20px; font-family: sans-serif;}
        .glass-card { background: #fff; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .barcode-item { 
            display: inline-block; 
            margin: 10px; 
            text-align: center; 
            border: 1px dashed #ccc;
            padding: 10px;
            border-radius: 8px;
            background: white;
        }
        .barcode-svg { max-height: 80px; }
        .print-area { display: none; }
        
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; display: block; }
            .barcode-item { margin: 15px; page-break-inside: avoid; border: none;}
        }
    </style>

    <!-- Global UI Additions -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    <style>
        .font-sizer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            padding: 5px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 9999;
            display: flex;
            gap: 5px;
        }
        .font-sizer button {
            border: none;
            background: #f8f9fa;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .font-sizer button:hover { background: #e9ecef; }
    </style>

</head>
<body>
    <div class="container no-print">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">🖨️ พิมพ์บาร์โค้ด (Print Barcodes)</h2>
            <a href="/inventory" class="btn btn-outline-secondary rounded-pill">⬅ กลับคลังสินค้า</a>
        </div>
        
        <div class="glass-card mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0">เลือกรายการและจำนวนที่จะพิมพ์</h5>
                <input type="text" id="searchBar" class="form-control w-25 rounded-pill" placeholder="🔍 ค้นหาสินค้า..." onkeyup="filterProducts()">
            </div>
            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>รหัสบาร์โค้ด</th>
                            <th>ชื่อสินค้า / ยี่ห้อ / รุ่น</th>
                            <th>ราคา</th>
                            <th style="width: 150px;">จำนวนที่จะพิมพ์</th>
                        </tr>
                    </thead>
                    <tbody id="productList">
                        <!-- JS fills this -->
                    </tbody>
                </table>
            </div>
            <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm mt-3" onclick="preparePrint()">🖨️ ดำเนินการพิมพ์บาร์โค้ดที่เลือก</button>
        </div>
    </div>

    <!-- Hidden area for printing -->
    <div class="print-area" id="printArea">
    </div>

    <script>
        let productsData = [];

        async function fetchProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            productsData = data.filter(p => p.barcode); // only products with barcode
            
            const tbody = document.getElementById('productList');
            tbody.innerHTML = '';
            
            productsData.forEach((p, index) => {
                const subTitle = [p.brand, p.model, p.color].filter(Boolean).join(' / ');
                let row = `<tr>
                    <td>
                        <svg id="preview-barcode-${index}" style="max-height: 40px;"></svg>
                    </td>
                    <td class="fw-bold">
                        ${p.name} 
                        ${subTitle ? `<br><small class="text-muted">${subTitle}</small>` : ''}
                    </td>
                    <td class="text-success fw-bold">${formatMoney(p.price)}</td>
                    <td>
                        <input type="number" min="0" value="0" class="form-control text-center print-qty fw-bold" 
                            data-id="${p.id}" data-barcode="${p.barcode}" data-name="${p.name}" data-price="${p.price}">
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });

            // Render SVGs
            productsData.forEach((p, index) => {
                JsBarcode(`#preview-barcode-${index}`, p.barcode, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 14,
                    height: 30,
                    margin: 0
                });
            });
        }

        function preparePrint() {
            const inputs = document.querySelectorAll('.print-qty');
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';
            
            let hasItems = false;
            let totalQty = 0;

            // First check total quantity
            inputs.forEach(input => {
                const qty = parseInt(input.value);
                if(qty > 0) totalQty += qty;
            });

            if (totalQty === 0) {
                alert('กรุณาระบุจำนวนบาร์โค้ดที่ต้องการพิมพ์อย่างน้อย 1 รายการ');
                return;
            }
            if (totalQty > 10) {
                alert('เพื่อพิมพ์ให้พอดีใน 1 หน้า กรุณาเลือกพิมพ์บาร์โค้ดรวมกันไม่เกิน 10 ดวงครับ');
                return;
            }

            inputs.forEach(input => {
                const qty = parseInt(input.value);
                if(qty > 0) {
                    const barcode = input.getAttribute('data-barcode');
                    const name = input.getAttribute('data-name');
                    const price = parseFloat(input.getAttribute('data-price')).toFixed(2);
                    
                    for(let i=0; i<qty; i++) {
                        const div = document.createElement('div');
                        div.className = 'barcode-item';
                        
                        const img = document.createElement('img');
                        img.className = 'barcode-svg';
                        
                        const title = document.createElement('div');
                        title.style.fontSize = '14px';
                        title.style.fontWeight = 'bold';
                        title.innerText = name.length > 20 ? name.substring(0, 20) + '...' : name;
                        
                        const priceDiv = document.createElement('div');
                        priceDiv.style.fontSize = '14px';
                        priceDiv.style.fontWeight = 'bold';
                        priceDiv.innerText = `${price}`;
                        
                        div.appendChild(title);
                        div.appendChild(img);
                        div.appendChild(priceDiv);
                        printArea.appendChild(div);
                        
                        JsBarcode(img, barcode, {
                            format: "CODE128",
                            displayValue: true,
                            fontSize: 14,
                            height: 50,
                            margin: 5
                        });
                    }
                }
            });

            window.print();
        }

        function filterProducts() {
            const q = document.getElementById('searchBar').value.toLowerCase();
            const rows = document.querySelectorAll('#productList tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(q) ? '' : 'none';
            });
        }

        fetchProducts();
    </script>

    <!-- Global UI Scripts -->
    <div class="font-sizer">
        <button onclick="changeFontSize(-1)" title="ลดขนาดตัวอักษร">A-</button>
        <button onclick="changeFontSize(0)" title="ขนาดปกติ">A</button>
        <button onclick="changeFontSize(1)" title="เพิ่มขนาดตัวอักษร">A+</button>
    </div>
    <script>
        // Font Size Logic
        const sizes = ['0.85rem', '1rem', '1.15rem', '1.3rem'];
        let currentSizeIdx = parseInt(localStorage.getItem('fontSizeIdx')) || 1;
        
        function applyFontSize() {
            document.documentElement.style.fontSize = sizes[currentSizeIdx];
        }
        
        function changeFontSize(step) {
            if (step === 0) {
                currentSizeIdx = 1;
            } else {
                currentSizeIdx += step;
                if (currentSizeIdx < 0) currentSizeIdx = 0;
                if (currentSizeIdx >= sizes.length) currentSizeIdx = sizes.length - 1;
            }
            localStorage.setItem('fontSizeIdx', currentSizeIdx);
            applyFontSize();
        }
        
        applyFontSize();

        // Custom Thai Date Formatter for text (DD/MM/YYYY)
        function formatThaiDate(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            if (isNaN(d)) return dateString;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear() + 543;
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // Flatpickr (Thai Calendar + Buddhist Era Header)
        document.addEventListener('DOMContentLoaded', function() {
            const thaiFormatter = function(date, format, locale) {
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                if (format === "Y-m-d") {
                    return `${date.getFullYear()}-${m}-${d}`;
                }
                const y = date.getFullYear() + 543;
                return `${d}/${m}/${y}`;
            };
            
            function updateYearToBE(instance) {
                if (instance.yearElements && instance.yearElements.length > 0) {
                    const yearInput = instance.yearElements[0];
                    const currentVal = parseInt(yearInput.value);
                    if (currentVal < 2500) { // If it's CE, change to BE
                        yearInput.value = currentVal + 543;
                    }
                }
                if (instance.currentYearElement) {
                    const currentVal = parseInt(instance.currentYearElement.value);
                    if (currentVal < 2500) {
                        instance.currentYearElement.value = currentVal + 543;
                    }
                }
            }

            flatpickr("input[type=date]", {
                locale: "th",
                dateFormat: "Y-m-d", 
                altInput: true,
                altFormat: "d/m/Y", 
                formatDate: thaiFormatter,
                onReady: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onOpen: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onYearChange: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onMonthChange: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onPreCalendarPosition: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onChange: function(selectedDates, dateStr, instance) {
                    updateYearToBE(instance);
                }
            });
        });
        
        
        // Global Fetch interceptor to fix BE to CE dates in query params
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if (typeof resource === 'string' && resource.includes('?')) {
                resource = resource.replace(/([?&](?:start_date|end_date)=)(\d{4})(-\d{2}-\d{2})/g, function(match, p1, p2, p3) {
                    let year = parseInt(p2);
                    if (year > 2400) year -= 543;
                    return p1 + year + p3;
                });
            }
            return originalFetch(resource, config);
        };

        // Currency Formatter
        function formatMoney(num) {
            return Number(num).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    </script>

</body>
</html>
