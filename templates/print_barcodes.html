<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Barcodes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { background: #f5f7fa; padding-top: 20px; font-family: sans-serif;}
        .glass-card { background: #fff; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .barcode-item { 
            display: inline-block; 
            margin: 10px; 
            text-align: center; 
            border: 1px dashed #ccc;
            padding: 10px;
            border-radius: 8px;
            background: white;
        }
        .barcode-svg { max-height: 80px; }
        .print-area { display: none; }
        
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; display: block; }
            .barcode-item { margin: 15px; page-break-inside: avoid; border: none;}
        }
    </style>
</head>
<body>
    <div class="container no-print">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">🖨️ พิมพ์บาร์โค้ด (Print Barcodes)</h2>
            <a href="/inventory" class="btn btn-outline-secondary rounded-pill">⬅ กลับคลังสินค้า</a>
        </div>
        
        <div class="glass-card mb-4">
            <h5 class="fw-bold mb-3">เลือกรายการและจำนวนที่จะพิมพ์</h5>
            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>รหัสบาร์โค้ด</th>
                            <th>ชื่อสินค้า / ยี่ห้อ / รุ่น</th>
                            <th>ราคา</th>
                            <th style="width: 150px;">จำนวนที่จะพิมพ์</th>
                        </tr>
                    </thead>
                    <tbody id="productList">
                        <!-- JS fills this -->
                    </tbody>
                </table>
            </div>
            <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm mt-3" onclick="preparePrint()">🖨️ ดำเนินการพิมพ์บาร์โค้ดที่เลือก</button>
        </div>
    </div>

    <!-- Hidden area for printing -->
    <div class="print-area" id="printArea">
    </div>

    <script>
        let productsData = [];

        async function fetchProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            productsData = data.filter(p => p.barcode); // only products with barcode
            
            const tbody = document.getElementById('productList');
            tbody.innerHTML = '';
            
            productsData.forEach(p => {
                const subTitle = [p.brand, p.model, p.color].filter(Boolean).join(' / ');
                let row = `<tr>
                    <td><span class="badge bg-secondary">${p.barcode}</span></td>
                    <td class="fw-bold">
                        ${p.name} 
                        ${subTitle ? `<br><small class="text-muted">${subTitle}</small>` : ''}
                    </td>
                    <td class="text-success fw-bold">฿${p.price.toFixed(2)}</td>
                    <td>
                        <input type="number" min="0" value="0" class="form-control text-center print-qty fw-bold" 
                            data-id="${p.id}" data-barcode="${p.barcode}" data-name="${p.name}" data-price="${p.price}">
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function preparePrint() {
            const inputs = document.querySelectorAll('.print-qty');
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';
            
            let hasItems = false;

            inputs.forEach(input => {
                const qty = parseInt(input.value);
                if(qty > 0) {
                    hasItems = true;
                    const barcode = input.getAttribute('data-barcode');
                    const name = input.getAttribute('data-name');
                    const price = parseFloat(input.getAttribute('data-price')).toFixed(2);
                    
                    for(let i=0; i<qty; i++) {
                        const div = document.createElement('div');
                        div.className = 'barcode-item';
                        
                        const svg = document.createElement('svg');
                        svg.className = 'barcode-svg';
                        
                        const title = document.createElement('div');
                        title.style.fontSize = '14px';
                        title.style.fontWeight = 'bold';
                        title.innerText = name.length > 20 ? name.substring(0, 20) + '...' : name;
                        
                        const priceDiv = document.createElement('div');
                        priceDiv.style.fontSize = '14px';
                        priceDiv.style.fontWeight = 'bold';
                        priceDiv.innerText = `฿${price}`;
                        
                        div.appendChild(title);
                        div.appendChild(svg);
                        div.appendChild(priceDiv);
                        printArea.appendChild(div);
                        
                        JsBarcode(svg, barcode, {
                            format: "CODE128",
                            displayValue: true,
                            fontSize: 14,
                            height: 50,
                            margin: 5
                        });
                    }
                }
            });

            if(!hasItems) {
                alert('กรุณาระบุจำนวนบาร์โค้ดที่ต้องการพิมพ์อย่างน้อย 1 รายการ');
                return;
            }

            window.print();
        }

        fetchProducts();
    </script>
</body>
</html>
