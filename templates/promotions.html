<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการโปรโมชั่น — PJ Copy Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; }
  .glass-card { background: rgba(255, 255, 255, 0.95); border: none; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
  .hero-title { font-weight: 800; background: linear-gradient(135deg, #0d6efd, #0dcaf0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .table th { background-color: #f8f9fa; color: #555; }
</style>
</head>
<body>
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="hero-title m-0">🎁 ระบบโปรโมชั่น (Promotions)</h2>
    <a href="/" class="btn btn-outline-secondary rounded-pill fw-bold">⬅ กลับหน้าหลัก</a>
  </div>

  <div class="row g-4">
    <!-- Form Create Promotion -->
    <div class="col-md-4">
      <div class="glass-card">
        <h5 class="fw-bold mb-3">➕ สร้างโปรโมชั่นใหม่</h5>
        <form id="promoForm">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">ชื่อโปรโมชั่น</label>
            <input type="text" class="form-control" id="pName" placeholder="เช่น ซื้อ 10 แก้ว ฟรี 1 แก้ว" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">รายละเอียด (ตัวเลือก)</label>
            <textarea class="form-control" id="pDesc" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">ประเภทโปรโมชั่น</label>
            <select class="form-select" id="pType" required>
              <option value="discount">ลดราคาสินค้า</option>
              <option value="freebie">แถมฟรี (Buy X Get Y)</option>
              <option value="bill_discount">ส่วนลดท้ายบิล</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">เงื่อนไข/มูลค่า (เช่น ลด 10 บาท หรือ ซื้อ 10)</label>
            <input type="number" class="form-control" id="pValue" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">บันทึกโปรโมชั่น</button>
        </form>
      </div>
    </div>

    <!-- Promotions List -->
    <div class="col-md-8">
      <div class="glass-card">
        <h5 class="fw-bold mb-3">รายการโปรโมชั่นทั้งหมด</h5>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>ชื่อโปรโมชั่น</th>
                <th>ประเภท</th>
                <th class="text-center">สถานะ</th>
                <th class="text-end">จัดการ</th>
              </tr>
            </thead>
            <tbody id="promoTable">
              <!-- Render by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  async function fetchPromos() {
    try {
      const res = await fetch('/api/promotions');
      const data = await res.json();
      const tbody = document.getElementById('promoTable');
      tbody.innerHTML = '';
      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">ยังไม่มีโปรโมชั่น</td></tr>`;
        return;
      }
      data.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>
              <div class="fw-bold">${p.name}</div>
              <small class="text-muted">${p.description || '-'}</small>
            </td>
            <td><span class="badge bg-info text-dark">${p.promo_type}</span></td>
            <td class="text-center">
              <span class="badge ${p.is_active ? 'bg-success' : 'bg-secondary'}">${p.is_active ? 'เปิดใช้งาน' : 'ปิด'}</span>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-${p.is_active ? 'warning' : 'success'} rounded-pill fw-bold" onclick="togglePromo(${p.id})">
                ${p.is_active ? 'ระงับ' : 'เปิดใช้'}
              </button>
              <button class="btn btn-sm btn-danger rounded-pill fw-bold ms-1" onclick="deletePromo(${p.id})">ลบ</button>
            </td>
          </tr>
        `;
      });
    } catch(err) {
      console.error(err);
    }
  }

  document.getElementById('promoForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      name: document.getElementById('pName').value,
      description: document.getElementById('pDesc').value,
      promo_type: document.getElementById('pType').value,
      discount_value: document.getElementById('pValue').value
    };
    const res = await fetch('/api/promotions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(res.ok) {
      document.getElementById('promoForm').reset();
      fetchPromos();
    } else {
      const d = await res.json();
      alert('Error: ' + d.error);
    }
  });

  async function togglePromo(id) {
    await fetch(`/api/promotions/${id}/toggle`, { method: 'POST' });
    fetchPromos();
  }

  async function deletePromo(id) {
    if(!confirm('ยืนยันการลบโปรโมชั่นนี้?')) return;
    await fetch(`/api/promotions/${id}`, { method: 'DELETE' });
    fetchPromos();
  }

  window.addEventListener('DOMContentLoaded', fetchPromos);
</script>
</body>
</html>
