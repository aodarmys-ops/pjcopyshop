<html lang="en">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        .glass-card { background: #fff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 20px; height: 100%; display: flex; flex-direction: column;}

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
    function escapeHTML(str) {
        if(str === null || str === undefined) return '';
        return str.toString().replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
    }
    </script>

    <style>
        /* Modern Button Styles */
        .btn {
            border-radius: 8px !important;
            transition: all 0.2s ease-in-out !important;
            font-weight: 600 !important;
            letter-spacing: 0.3px !important;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: none;
        }
        .btn-success { background-color: #10b981; border-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; border-color: #059669; color: white; }
        .btn-primary { background-color: #3b82f6; border-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; border-color: #2563eb; color: white; }
        .btn-warning { background-color: #f59e0b; border-color: #f59e0b; color: white; }

<body>

    

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold text-dark">🛒 สั่งซื้อและรับเข้าสินค้า (Procurement)</h2>
            <a href="/" class="btn btn-outline-secondary rounded-circle p-2 shadow-sm" title="กลับหน้าหลัก"><span style="font-size: 1.25rem; line-height: 1; padding: 0 2px;">🏠</span></a>
        </div>
        
        <div class="row g-4 h-100 pb-4">
            <!-- Left: Add Items -->
            <div class="col-md-7">
                <div class="glass-card">
                    <div class="mb-3 position-relative">
                        <label class="form-label text-muted small fw-bold">สแกนบาร์โค้ด หรือ พิมพ์ชื่อสินค้า</label>
                        <form id="searchForm" class="d-flex">
                            <input type="text" class="form-control" id="barcodeInput" placeholder="สแกน หรือ ค้นหา..." autocomplete="off">
                            <button type="button" class="btn btn-success ms-2 rounded-pill px-3 fw-bold shadow-sm" style="white-space: nowrap;" onclick="new bootstrap.Modal(document.getElementById('addProductModal')).show()">+ เพิ่มสินค้า</button>
                            <button type="submit" class="btn btn-primary ms-2 rounded-pill px-4 d-none">ค้นหา</button>
                        </form>
                        <ul id="purchaseAutocomplete" class="list-group position-absolute w-100 shadow mt-1" style="z-index: 1000; display: none; max-height: 250px; overflow-y: auto; cursor: pointer;"></ul>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table align-middle table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>รายการ (สินค้า)</th>
                                    <th class="text-center">รับมา (กล่อง/แพ็ค)</th>
                                    <th class="text-center">ชิ้น / กล่อง</th>
                                    <th class="text-center">ราคาทุน / กล่อง</th>
                                    <th class="text-center">ทุน / ชิ้น</th>
                                    <th class="text-end">รวม</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="cartTable">
                                <!-- JS items here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right: Checkout -->
            <div class="col-md-5">
                <div class="glass-card">
                    <h5 class="fw-bold mb-3">สรุปยอดการสั่งซื้อ</h5>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">ชื่อซัพพลายเออร์ (Supplier)</label>
                        <input type="text" class="form-control" id="supplierName" placeholder="เช่น ร้านค้าส่ง A">
                    </div>

                    <div class="mt-auto">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="hasVat" onchange="renderCart()">
                            <label class="form-check-label fw-bold text-dark" for="hasVat">คำนวณ VAT 7%</label>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">ช่องทางชำระเงิน</label>
                            <select id="paymentMethod" class="form-select rounded-pill shadow-sm">
                                <option value="Cash">เงินสด (Cash)</option>
                                <option value="PromptPay">เงินโอน (PromptPay/Transfer)</option>
                                <option value="Credit Card">บัตรเครดิต (Credit Card)</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between mb-2 text-muted">
                            <span>ยอดรวมก่อน VAT (Subtotal)</span>
                            <span id="subtotalDisplay">0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>ภาษีมูลค่าเพิ่ม 7% (VAT)</span>
                            <span id="vatDisplay">0.00</span>
                        </div>

                        <div class="total-box mb-3 shadow">
                            <h5 class="m-0 text-white-50">ยอดรวมสุทธิ (Net Total)</h5>
                            <h1 class="m-0 fw-bold text-warning" id="totalAmount">0.00</h1>
                        </div>

                        <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow" onclick="checkout()">
                            📝 บันทึกรับเข้าสินค้า
                        </button>
                    </div>
                </div>
            </div>

    <script>
        let cart = [];

        const bInput = document.getElementById('barcodeInput');
        const acList = document.getElementById('purchaseAutocomplete');

        bInput.addEventListener('input', async (e) => {
            const q = e.target.value.trim();
            if(!q) {
                acList.style.display = 'none';
                return;
            }
            const res = await fetch(`/api/products/search?q=${encodeURIComponent(q)}`);
            const products = await res.json();
            
            acList.innerHTML = '';
            if(products.length > 0) {
                products.slice(0, 5).forEach(p => {
                    let li = document.createElement('li');
                    li.className = 'list-group-item list-group-item-action cursor-pointer';
                    const brandText = p.brand ? ` <span class="badge bg-secondary ms-1">${escapeHTML(p.brand)}</span>` : '';
                    li.innerHTML = `<strong>${escapeHTML(p.name)}</strong>${brandText} <small class="text-muted ms-1">[${escapeHTML(p.barcode || 'ไม่มีบาร์โค้ด')}]</small>`;
                    li.onclick = () => {
                        addToCart(p);
                        bInput.value = '';
                        acList.style.display = 'none';
                        bInput.focus();
                    };
                    acList.appendChild(li);
                });
            } else {
                acList.innerHTML = '<li class="list-group-item text-muted text-center py-3">ไม่พบสินค้า</li>';
            }
            acList.style.display = 'block';
        });

        document.addEventListener('click', (e) => {
            if(!bInput.contains(e.target) && !acList.contains(e.target)) {
                acList.style.display = 'none';
            }
        });

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const q = bInput.value.trim();
            if (!q) return;

            const res = await fetch(`/api/products/search?q=${encodeURIComponent(q)}`);
            const products = await res.json();
            
            if (products.length === 1) {
                addToCart(products[0]);
                bInput.value = '';
                acList.style.display = 'none';
                bInput.focus();
            } else if (products.length > 1) {
                bInput.dispatchEvent(new Event('input'));
            } else {
                alert("ไม่พบสินค้า!");
            }
        });

        function addToCart(product) {
            // Check if already in cart
            const existing = cart.find(i => i.id === product.id);
            if (existing) {
                existing.packs += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    cost_per_pack: product.cost > 0 ? product.cost : 0, 
                    pieces_per_pack: 1,
                    packs: 1
                });
            }
            renderCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartTable');
            tbody.innerHTML = '';
            let subtotal = 0;
            
            cart.forEach(item => {
                const itemTotal = item.cost_per_pack * item.packs;
                const costPerPiece = (item.cost_per_pack / item.pieces_per_pack) || 0;
                subtotal += itemTotal;
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="fw-bold">${escapeHTML(item.name)}</div>
                            ${item.brand ? `<small class="text-muted">ยี่ห้อ: ${escapeHTML(item.brand)}</small>` : ''}
                        </td>
                        <td style="width: 100px;">
                            <input type="number" class="form-control text-center fw-bold" value="${escapeHTML(item.packs)}" onchange="updateCart(${item.id}, 'packs', this.value)">
                        </td>
                        <td style="width: 100px;">
                            <input type="number" class="form-control text-center fw-bold" value="${escapeHTML(item.pieces_per_pack)}" onchange="updateCart(${item.id}, 'pieces', this.value)">
                        </td>
                        <td style="width: 120px;">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"></span>
                                <input type="number" step="0.01" min="0" class="form-control text-center fw-bold text-primary" value="${item.cost_per_pack}" onchange="updateCart(${item.id}, 'cost', this.value)">
                            </div>
                        </td>
                        <td class="text-center text-muted fw-bold">
                            ${formatMoney(costPerPiece)}
                        </td>
                        <td class="text-end fw-bold text-dark">${formatMoney(itemTotal)}</td>
                        <td class="text-end" style="width: 40px;">
                            <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="removeFromCart(${item.id})">✖</button>
                        </td>
                    </tr>
                `;
            });
            
            const hasVat = document.getElementById('hasVat').checked;
            const vatAmount = hasVat ? subtotal * 0.07 : 0;
            const netTotal = subtotal + vatAmount;

            document.getElementById('subtotalDisplay').innerText = `${formatMoney(subtotal)}`;
            document.getElementById('vatDisplay').innerText = `${formatMoney(vatAmount)}`;
            document.getElementById('totalAmount').innerText = `${formatMoney(netTotal)}`;
        }

        function updateCart(id, field, value) {
            const val = parseFloat(value);
            if(val < 0) return;
            const item = cart.find(i => i.id === id);
            if (!item) return;
            
            if (field === 'packs') {
                if(val === 0) { removeFromCart(id); return; }
                item.packs = val;
            } else if (field === 'pieces') {
                item.pieces_per_pack = val > 0 ? val : 1;
            } else if (field === 'cost') {
                item.cost_per_pack = val;
            }
            renderCart();
        }

        async function checkout() {
            if (cart.length === 0) {
                alert("ไม่มีสินค้าในรายการสั่งซื้อ!");
                return;
            }
            
            const supplier = document.getElementById('supplierName').value.trim();
            const hasVat = document.getElementById('hasVat').checked;
            const pMethod = document.getElementById('paymentMethod').value;
            
            const payload = {
                supplier_name: supplier || 'ไม่ระบุ',
                has_vat: hasVat,
                payment_method: pMethod,
                items: cart.map(item => ({
                    id: item.id,
                    qty: item.packs * item.pieces_per_pack,
                    cost: item.cost_per_pack / item.pieces_per_pack
                }))
            };

            const res = await fetch('/api/purchases', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("บันทึกรับเข้าสินค้าเรียบร้อยแล้ว!\nระบบได้อัปเดตสต๊อกและบันทึกลงรายจ่ายร้านค้าอัตโนมัติ");
                
                cart = [];
                document.getElementById('supplierName').value = '';
                document.getElementById('hasVat').checked = false;
                renderCart();
                document.getElementById('barcodeInput').value = '';
                document.getElementById('barcodeInput').focus();
            } else {
                alert("เกิดข้อผิดพลาดในการบันทึก");
            }
        }
    </script>

    <!-- Global UI Scripts -->
    <script>
        // Font Size Logic
        const sizes = ['0.85rem', '1rem', '1.15rem', '1.3rem'];
        let currentSizeIdx = parseInt(localStorage.getItem('fontSizeIdx')) || 1;
        
        function applyFontSize() {
            document.documentElement.style.fontSize = sizes[currentSizeIdx];
        }
        
        function changeFontSize(step) {
            if (step === 0) {
                currentSizeIdx = 1;
            } else {
                currentSizeIdx += step;
                if (currentSizeIdx < 0) currentSizeIdx = 0;
                if (currentSizeIdx >= sizes.length) currentSizeIdx = sizes.length - 1;
            }
            localStorage.setItem('fontSizeIdx', currentSizeIdx);
            applyFontSize();
        }
        
        applyFontSize();

        // Custom Thai Date Formatter for text (DD/MM/YYYY)
        function formatThaiDate(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            if (isNaN(d)) return dateString;
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear() + 543;
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // Flatpickr (Thai Calendar + Buddhist Era Header)
        document.addEventListener('DOMContentLoaded', function() {
            const thaiFormatter = function(date, format, locale) {
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                if (format === "Y-m-d") {
                    return `${date.getFullYear()}-${m}-${d}`;
                }
                const y = date.getFullYear() + 543;
                return `${d}/${m}/${y}`;
            };
            
            function updateYearToBE(instance) {
                if (instance.yearElements && instance.yearElements.length > 0) {
                    const yearInput = instance.yearElements[0];
                    const currentVal = parseInt(yearInput.value);
                    if (currentVal < 2500) { // If it's CE, change to BE
                        yearInput.value = currentVal + 543;
                    }
                }
                if (instance.currentYearElement) {
                    const currentVal = parseInt(instance.currentYearElement.value);
                    if (currentVal < 2500) {
                        instance.currentYearElement.value = currentVal + 543;
                    }
                }
            }

            flatpickr("input[type=date]", {
                locale: "th",
                dateFormat: "Y-m-d", 
                altInput: true,
                altFormat: "d/m/Y", 
                formatDate: thaiFormatter,
                onReady: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onOpen: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onYearChange: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onMonthChange: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onPreCalendarPosition: function(selectedDates, dateStr, instance) { updateYearToBE(instance); },
                onChange: function(selectedDates, dateStr, instance) {
                    updateYearToBE(instance);
                }
            });
        });
        
        
        // Global Fetch interceptor to fix BE to CE dates in query params
        const originalFetch = window.fetch;
        window.fetch = async function() {
            let [resource, config] = arguments;
            if (typeof resource === 'string' && resource.includes('?')) {
                resource = resource.replace(/([?&](?:start_date|end_date)=)(\d{4})(-\d{2}-\d{2})/g, function(match, p1, p2, p3) {
                    let year = parseInt(p2);
                    if (year > 2400) year -= 543;
                    return p1 + year + p3;
                });
            }
            return originalFetch(resource, config);
        };

        // Currency Formatter
        function formatMoney(num) {
            return Number(num).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    </script>


    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <div class="modal-header border-0 bg-light rounded-top-4">
                    <h5 class="modal-title fw-bold text-dark">📦 เพิ่มสินค้าใหม่แบบเร่งด่วน</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="quickAddProductForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">ชื่อสินค้า</label>
                            <input type="text" class="form-control" id="qName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">ประเภท</label>
                            <select class="form-select" id="qType">
                                <option value="Service">งานบริการ</option>
                                <option value="Stationery">เครื่องเขียน</option>
                                <option value="Gift shop">กิ๊ฟช๊อป</option>
                                <option value="Dolls">ตุ๊กตา</option>
                                <option value="Toys">ของเล่น</option>
                                <option value="Perfume">น้ำหอม</option>
                                <option value="IT equipment">อุปกรณ์ IT</option>
                                <option value="Brewed Drink">เครื่องดื่มชง</option>
                                <option value="Water">น้ำเปล่า</option>
                                <option value="Soft drinks">น้ำอัดลม</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-4 mb-3">
                                <label class="form-label text-muted small fw-bold">ยี่ห้อ</label>
                                <input type="text" class="form-control" id="qBrand" placeholder="-">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label text-muted small fw-bold">รุ่น</label>
                                <input type="text" class="form-control" id="qModel" placeholder="-">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label text-muted small fw-bold">สี</label>
                                <input type="text" class="form-control" id="qColor" placeholder="-">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">บาร์โค้ด (เว้นว่างไว้หากต้องการให้ระบบสร้างให้)</label>
                            <input type="text" class="form-control" id="qBarcode">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">ต้นทุน</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="qCost">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">ราคาขาย</label>
                                <input type="number" step="0.01" min="0.25" class="form-control" id="qPrice" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">จำนวนสต๊อก (ตั้งต้น)</label>
                                <input type="number" class="form-control" id="qStock" value="0">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted small fw-bold">จุดสั่งซื้อ (Reorder)</label>
                                <input type="number" class="form-control" id="qReorder" value="5">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-2 fw-bold rounded-pill shadow-sm">💾 บันทึกและเพิ่มเข้าตะกร้าสั่งซื้อ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('quickAddProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('qName').value,
                type: document.getElementById('qType').value,
                barcode: document.getElementById('qBarcode').value,
                brand: document.getElementById('qBrand').value || '-',
                model: document.getElementById('qModel').value || '-',
                color: document.getElementById('qColor').value || '-',
                cost: parseFloat(document.getElementById('qCost').value) || 0,
                price: parseFloat(document.getElementById('qPrice').value),
                stock_qty: parseInt(document.getElementById('qStock').value) || 0,
                reorder_level: parseInt(document.getElementById('qReorder').value) || 5
            };
            
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                const newProduct = await res.json();
                
                // Hide modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('addProductModal'));
                modal.hide();
                
                // Clear form
                e.target.reset();
                
                // Fetch product details and add to cart
                const pRes = await fetch(`/api/products/${newProduct.id}`);
                const pData = await pRes.json();
                
                // Standardize cost and pieces config for Purchases cart
                pData.pieces_per_pack = 1;
                pData.cost_per_pack = pData.cost;
                pData.packs = 1;
                
                cart.unshift(pData);
                renderCart();
                
                document.getElementById('barcodeInput').focus();
            } else {
                alert("เกิดข้อผิดพลาดในการเพิ่มสินค้า");
            }
        });
    </script>
</body>
</html>
